# Cloud Optimizer MVP - Docker Compose Configuration
version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=cloudoptimizer
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cloudoptimizer
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
